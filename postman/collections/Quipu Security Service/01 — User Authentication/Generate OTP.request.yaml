$kind: http-request
description: Sends a one-time password (OTP) to the user's registered email address. Must be called before /user/login. Tenant must be active.
url: "{{baseUrl}}/user/generate-otp?isUserAdmin=false"
method: POST
headers:
  Content-Type: application/json
  X-Tenant-ID: "{{tenantId}}"
queryParams:
  - key: isUserAdmin
    value: "false"
    description: Set true for admin user OTP flow
body:
  type: json
  content: |-
    {
      "username": "user@example.com",
      "password": "your-password"
    }
order: 1000
