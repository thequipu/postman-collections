    {
      "dataSourceModel": {
        "id": 1,
        "name": "s3-csv-source",
        "driverType": "CSV"
      },
      "metaData": {
        "bucket": "quipu-data",
        "prefix": "realm-1/v2/"
      }
    }
order: 6000
