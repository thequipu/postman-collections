$kind: http-request
url: "{{baseUrl}}/datasource/upload"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dataSourceModel": {
        "name": "s3-csv-source",
        "driverType": "CSV",
        "deleted": false
      },
      "metaData": {
        "bucket": "quipu-data",
        "prefix": "realm-1/"
      }
    }
order: 5000
