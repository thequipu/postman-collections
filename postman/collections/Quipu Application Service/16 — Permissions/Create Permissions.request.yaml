$kind: http-request
url: "{{baseUrl}}/permissions"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    [
      { "name": "VIEW",       "description": "Read-only access" },
      { "name": "EDIT",       "description": "Read and write access" },
      { "name": "ADMIN",      "description": "Full administrative access" },
      { "name": "ROW_ACCESS", "description": "Row-level data access" }
    ]
order: 1000
