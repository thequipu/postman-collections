$kind: collection
description: |-
  Complete REST API collection for the Quipu Application Service microservice (port 3033). Covers datasources, realms, schemas, versions, atomic & document ingestion, entity/knowledge graph, RBAC, S3 file management, watcher, and admin/migration endpoints.

  Collection variables:
  - {{baseUrl}}  — default http://localhost:3033
  - {{token}}    — JWT bearer token from your IdP
  - {{tenantId}} — tenant identifier (X-Tenant-ID header)
  - {{userId}}   — user identifier (User-Id header for migration endpoints)
variables:
  baseUrl: http://localhost:3033
  token: ""
  tenantId: ""
  userId: ""
scripts:
  - type: http:beforeRequest
    code: "try {\r

      \    const response = await pm.execution.runRequest(\"56383100-bb2a2d58-63d7-4e87-8bde-af2f2be608c3\");\r

      \    pm.collectionVariables.set(\"token\", response.json()['access_token']);\r

      } catch (err) {\r

      \    console.error(err);\r

      }"
    language: text/javascript
    requests:
      56383100-bb2a2d58-63d7-4e87-8bde-af2f2be608c3:
        workspace: d217b5f6-7fa2-4913-8446-5d30db110208
        collection: 56383100-3d475bf7-b3b1-4131-9835-e68c54f58e68
        location:
          - Access_Token
          - onprem_access_token
auth:
  - id: ff1d8d04-3a3d-464d-b82b-9b2b1e24553f
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
