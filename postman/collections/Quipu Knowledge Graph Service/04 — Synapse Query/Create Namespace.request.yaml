  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "ns1",
      "schemaName": "prod_schema",
      "schemaVersion": "v1",
      "requiresHistoricIngest": false
    }
order: 3000
