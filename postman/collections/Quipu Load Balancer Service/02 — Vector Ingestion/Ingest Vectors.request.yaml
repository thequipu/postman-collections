  content: |-
    [
      {
        "id": "doc-1",
        "text": "Acme Corp signed a new contract with Beta LLC.",
        "collectionName": "production_realm_docs",
        "url": "s3://quipu-data/docs/doc-1.pdf",
        "pathId": 1,
        "pathIdentifier": 1001
      }
    ]
order: 1000
