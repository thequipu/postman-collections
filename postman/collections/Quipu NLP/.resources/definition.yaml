$kind: collection
description: |-
  Stateless FastAPI sidecar used by quipu-nexus for tokenizing TextItem content, merging nexus-supplied per-token URI matches into final spans, sentence splitting, and text embeddings via sentence-transformers.

  No auth middleware - this is an internal sidecar service, not internet facing. Wire-format models are the contract with nexus's `NlpClient`; field names must stay in sync.
variables:
  baseUrl: http://localhost:8009
scripts:
  - type: http:beforeRequest
    code: "try {\r

      \    const response = await pm.execution.runRequest(\"56383100-bb2a2d58-63d7-4e87-8bde-af2f2be608c3\");\r

      \    pm.collectionVariables.set(\"token\", response.json()['access_token']);\r

      } catch (err) {\r

      \    console.error(err);\r

      }"
    language: text/javascript
    requests:
      56383100-bb2a2d58-63d7-4e87-8bde-af2f2be608c3:
        workspace: d217b5f6-7fa2-4913-8446-5d30db110208
        collection: 56383100-3d475bf7-b3b1-4131-9835-e68c54f58e68
        location:
          - Access_Token
          - onprem_access_token
