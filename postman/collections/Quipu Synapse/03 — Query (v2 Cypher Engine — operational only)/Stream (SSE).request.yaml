$kind: http-request
url: "{{baseUrl}}/api/v2/cypher/stream"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "query": "MATCH (n:Person)-[:KNOWS*1..3]->(m) RETURN m",
      "namespace": "{{namespace}}"
    }
order: 3000
