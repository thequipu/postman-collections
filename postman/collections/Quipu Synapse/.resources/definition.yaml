$kind: collection
description: |-
  Complete REST API collection for Quipu Synapse (default port 8001 on the seed node; 8081-8090 for workers) — the distributed, multi-tenant graph database processing engine (Spring Boot + Pekko cluster sharding + YugabyteDB event journal + Kafka ingestion).

  Collection variables:
  - {{baseUrl}}    — default http://localhost:8001
  - {{token}}      — bearer JWT sent as Authorization header (RSA-signed, validated for signature/expiry/tenant membership)
  - {{tenantId}}   — tenant identifier (X-Tenant-ID header; fallback when tenantId isn't in the JWT claims)
  - {{namespace}}  — target namespace/schema, default "public"
  - {{userId}}     — target user id for User Policy endpoints
  - {{watcherId}}  — a registered watcher id (fill in after Register Watcher)
  - {{queryId}}    — an async/streaming query id (fill in after Async Submit)

  Auth notes:
  - Public (no auth): GET /health, GET /actuator/**, GET /namespaces, GET /namespaces/{name}/status, GET /namespaces/{name}/stats.
  - Admin role required: namespace create/enable/disable/delete/historic-ingest-complete/projection-*, User Policy endpoints. Admin role name defaults to ADMIN (configurable via ADMIN_ROLE) and bypasses all per-namespace access policies.
  - All error responses share the shape { "error": "ERROR_CODE", "message": "..." } — PLANNING_ERROR/INVALID_REQUEST (400), TIMEOUT (408), EXECUTION_ERROR (500).

  This collection covers every controller EXCEPT the v2 Cypher query-language surface (/api/v2/cypher/**, Cypher2Controller), which already has an exhaustive dedicated collection at postman/cypher2.postman_collection.json (one request per openCypher construct, generated by postman/gen_collection.py). Folder '03 — Query (v2 Cypher Engine)' below covers only the 6 operational endpoints of that engine (query/explain/stream/async submit/poll/cancel) with a minimal example — import cypher2.postman_collection.json separately for full language coverage. Folder '02 — Query (Legacy v1)' covers the older /query/cypher* engine (QueryController), which is a separate implementation from the v2 engine.
variables:
  baseUrl: http://localhost:8001
  token: ""
  tenantId: ""
  namespace: public
  userId: ""
  watcherId: ""
  queryId: ""
scripts:
  - type: http:beforeRequest
    code: "try {\r

      \    const response = await pm.execution.runRequest(\"56383100-bb2a2d58-63d7-4e87-8bde-af2f2be608c3\");\r

      \    pm.collectionVariables.set(\"token\", response.json()['access_token']);\r

      } catch (err) {\r

      \    console.error(err);\r

      }"
    language: text/javascript
    requests:
      56383100-bb2a2d58-63d7-4e87-8bde-af2f2be608c3:
        workspace: d217b5f6-7fa2-4913-8446-5d30db110208
        collection: 56383100-3d475bf7-b3b1-4131-9835-e68c54f58e68
        location:
          - Access_Token
          - onprem_access_token
auth:
  - id: 48aefe13-eea8-4a0c-8df7-8389cb660937
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
