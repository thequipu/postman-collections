$kind: http-request
description: Response content-type is text/event-stream. Postman shows raw SSE frames; watch for start/node/edge/columns/row/complete events.
url: "{{baseUrl}}/query/cypher/stream"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "query": "MATCH (n:Person)-[:KNOWS*1..3]->(m) RETURN m",
      "namespace": "{{namespace}}"
    }
order: 5000
