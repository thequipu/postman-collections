$kind: http-request
url: "{{baseUrl}}/s3-upload/getCsvHeader?datasourceName=sales-csv"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/vnd.quipu.file-upload+json;version=1.0.0
queryParams:
  datasourceName: sales-csv
body:
  type: json
  content: |-
    {
      "bucket": "quipu-data",
      "key": "realm-1/sales.csv",
      "region": "us-east-1",
      "accessKey": "AKIA...",
      "secret": "secret"
    }
order: 4000
